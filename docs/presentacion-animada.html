<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChronoBike · presentación animada</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Caveat:wght@600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--bg2:#0c1222;--surface:#111a2e;--surface2:#16213a;--line:#22304d;--line2:#2d3d60;--text:#e8eefc;--muted:#8b9ab8;--dim:#5d6b88;
  --orange:#ff5a1f;--amber:#ffb21f;--lime:#c6f432;--green:#22c55e;--red:#f43f5e;--cyan:#22d3ee;--pink:#f472b6;--violet:#a78bfa;
  --display:'Barlow Condensed','Inter',sans-serif;--bar:58px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03050b;color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
#view{position:fixed;inset:0 0 var(--bar) 0;display:grid;place-items:center;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;border-radius:6px;
  background:radial-gradient(900px 500px at 85% -10%,rgba(255,90,31,.16),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(198,244,50,.08),transparent 60%),var(--bg)}
#scene{position:absolute;inset:0}
.ab{position:absolute}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em}
.title{position:absolute;left:80px;top:54px;font-family:var(--display);font-weight:800;font-size:58px;text-transform:uppercase;line-height:1}
.title b{color:var(--orange)} .title i{font-style:normal;color:var(--lime)}
.kicker{position:absolute;left:82px;top:30px;font-weight:800;font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.phone{position:absolute;background:#04060c;border-radius:42px;padding:13px;box-shadow:0 0 0 2px #1d2740,0 30px 80px rgba(0,0,0,.55)}
.phone::before{content:"";position:absolute;top:20px;left:50%;width:84px;height:20px;margin-left:-42px;background:#04060c;border-radius:0 0 14px 14px;z-index:3}
.scr{position:relative;width:100%;height:100%;border-radius:30px;background:#0a1020;overflow:hidden}
.tv{position:absolute;background:#04060c;border-radius:14px;padding:12px;box-shadow:0 0 0 2px #1d2740,0 30px 80px rgba(0,0,0,.5)}
.tv::after{content:"";position:absolute;left:42%;right:42%;bottom:-26px;height:26px;background:linear-gradient(#1d2740,#0d1322);border-radius:0 0 6px 6px}
.lap{position:absolute;background:#04060c;border-radius:14px 14px 4px 4px;padding:10px;box-shadow:0 0 0 2px #1d2740,0 30px 80px rgba(0,0,0,.5)}
.lap::after{content:"";position:absolute;left:-30px;right:-30px;bottom:-16px;height:16px;background:linear-gradient(#26314e,#141b2e);border-radius:0 0 14px 14px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:99px;font-weight:800;font-size:22px;background:var(--surface2);border:1px solid var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;letter-spacing:.03em;border-radius:14px;text-transform:uppercase}
.bib{display:inline-block;min-width:54px;text-align:center;background:#fff;color:#0b1020;border-radius:6px;font-weight:800;font-family:var(--display);padding:0 6px}
.row{display:grid;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:18px}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--lime);box-shadow:0 0 22px 6px rgba(198,244,50,.6);z-index:20}
.pk.q{background:var(--amber);box-shadow:0 0 22px 6px rgba(255,178,31,.6)}
svg.ov{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none}
/* subtítulos */
#subs{visibility:hidden;position:absolute;left:50%;bottom:34px;transform:translateX(-50%);max-width:1300px;text-align:center;z-index:50;pointer-events:none}
#subs span{display:inline;background:rgba(3,5,11,.82);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 16px;border-radius:10px;font-size:34px;font-weight:700;line-height:1.55;color:#fff;text-shadow:0 2px 6px #000}
#subs.off{display:none}
#prog{position:absolute;left:0;top:0;height:5px;background:linear-gradient(90deg,var(--orange),var(--amber));z-index:60;width:0}
/* barra de control */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);display:flex;align-items:center;gap:8px;padding:0 12px;background:#0a0f1c;border-top:1px solid var(--line);z-index:100}
#bar button{font:inherit;font-weight:700;font-size:15px;color:var(--text);background:var(--surface2);border:1px solid var(--line2);border-radius:10px;height:38px;min-width:40px;padding:0 10px;cursor:pointer}
#bar button:hover{border-color:var(--muted)} #bar button.on{background:var(--orange);border-color:var(--orange);color:#1a0b02}
#dots{display:flex;gap:5px;flex:1;min-width:0;overflow:hidden;align-items:center}
#dots i{flex:1;height:8px;border-radius:99px;background:var(--line2);cursor:pointer;position:relative;overflow:hidden;min-width:10px}
#dots i b{position:absolute;inset:0;width:0;background:var(--orange)}
#dots i.done b{width:100%}
#time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:92px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden} .seg button{border:0!important;border-radius:0!important}
#voz{font-size:12px;color:var(--dim);max-width:140px;line-height:1.1}
.seg{flex-shrink:0}
@media (max-width:720px){#voz,#time,#dots{display:none}#bar{gap:5px;padding:0 6px;justify-content:space-between}#bar button{min-width:34px;padding:0 8px;font-size:14px}}
/* portada */
#cover{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(3,5,11,.78);backdrop-filter:blur(4px)}
#cover .box{text-align:center;padding:30px}
#cover h1{font-size:clamp(40px,7vw,86px);font-weight:800;text-transform:uppercase;line-height:.9} #cover h1 span{color:var(--lime)}
#cover p{color:var(--muted);font-size:18px;margin:14px 0 26px}
#cover button{font:inherit;font-family:var(--display);font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:16px 32px;border-radius:16px;border:0;background:var(--orange);color:#1a0b02;cursor:pointer;box-shadow:0 0 0 6px rgba(255,90,31,.25)}
#cover .alt{display:block;margin:16px auto 0;background:none;box-shadow:none;color:var(--muted);font-size:18px;text-decoration:underline;padding:4px}
#cover.hide{display:none}
</style>
</head>
<body>
<div id="view"><div id="stage"><div id="prog"></div><div id="scene"></div><div id="subs"><span></span></div></div></div>
<div id="bar">
  <button id="bPlay" title="Reproducir / pausa (espacio)">▶</button>
  <button id="bPrev" title="Escena anterior (←)">⏮</button>
  <button id="bNext" title="Escena siguiente (→)">⏭</button>
  <div id="dots"></div>
  <span id="time">0:00 / 0:00</span>
  <span class="seg"><button id="vLarga">Larga</button><button id="vCorta">Corta</button></span>
  <button id="bSubs" class="on" title="Subtítulos (S)">CC</button>
  <button id="bMute" title="Silenciar (M)">🔊</button>
  <button id="bLoop" title="Repetir al terminar">🔁</button>
  <button id="bFull" title="Pantalla completa (F)">⛶</button>
  <span id="voz"></span>
</div>
<div id="cover"><div class="box">
  <h1>Chrono<span>Bike</span></h1>
  <p id="coverSub">Presentación · versión larga · 2 min · con voz y subtítulos</p>
  <button id="bStart">▶ Ver presentación</button>
  <button class="alt" id="bOther">Ver la versión corta</button>
</div></div>

<script type="module">
const $ = (s, r = document) => r.querySelector(s);
const qs = new URLSearchParams(location.search);
let VERSION = qs.get('v') === 'corta' ? 'corta' : 'larga';

/* ───────── Guion ───────── */
const NARR = {
  larga: [
    'Esto es ChronoBike: cronometraje de circuitos y resultados en vivo, desde un celular.',
    'En muchas carreras todavía se cronometra con libreta y Excel. Los resultados tardan horas, se cuelan errores al pasar los datos, y los corredores no dejan de preguntar en qué lugar quedaron.',
    'Con ChronoBike, preparas el evento en minutos. Creas la carrera, importas a tus corredores desde Excel, y el sistema arma las categorías con sus vueltas y colores.',
    'El día de la carrera, das la salida de cada categoría con un toque. En la meta, el registrador teclea el dorsal, ve al instante quién es y qué vuelta lleva, y registra el paso. Un sonido fuerte y la vibración lo confirman, y la app avisa si un paso parece duplicado.',
    'Cada paso llega en segundos a la nube y se reparte en tiempo real: a la pantalla de la meta, al celular del público y al panel del staff. Sin recargar, sin esperar.',
    '¿Y si se cae el internet? La app sigue registrando, guarda los pasos en el celular y los envía solos cuando vuelve la señal. Ningún paso se pierde.',
    'Los resultados se calculan solos: podio por categoría, tiempo de cada vuelta, la mejor vuelta, la velocidad promedio, y quien no terminó queda como DNF al cerrar el evento. Todo se exporta a Excel o PDF con un clic.',
    'El público escanea el código QR de la pantalla y consulta los resultados en su celular, sin descargar nada.',
    'Y cada evento queda guardado: tu serial completo, con podios y tiempos de todas las etapas, para consultarlo cuando quieras.',
    'ChronoBike: solo necesitas un celular, resultados en tiempo real, y funciona aunque falle el internet. Agenda una demostración con nuestro equipo.',
  ],
  corta: [
    'ChronoBike: cronometraje y resultados en vivo, desde un celular.',
    'En la meta, tecleas el dorsal y registras el paso con un toque.',
    'Los resultados llegan en segundos a la pantalla y al celular del público.',
    'Podios, tiempos por vuelta y métricas, calculados solos.',
    'Funciona aunque falle el internet. Agenda tu demostración.',
  ],
};
/* escena: [constructor, duración planeada (s), duración nominal del constructor (s), modo compacto] */
const PLAN = {
  larga: [['apertura', 7, 7], ['problema', 13, 13], ['preparar', 13, 13], ['cronometrar', 19, 19], ['vivo', 12, 12],
    ['offline', 10, 10], ['resultados', 17, 17], ['qr', 8, 8], ['historial', 10, 10], ['cierre', 11, 11]],
  corta: [['apertura', 6, 7], ['cronometrar', 6, 6, true], ['vivo', 6, 6, true], ['resultados', 6, 6, true], ['cierre', 6, 11]],
};
const CPS = 14.5; // caracteres por segundo de la voz (medido en las tomas)

/* ───────── Motor ───────── */
const root = $('#scene'), stage = $('#stage');
const EASE = 'cubic-bezier(.2,.8,.2,1)';
let anims = [], tasks = [], ticks = [], K = 1, playing = false, st = 0, last = 0, idx = 0, ended = false;
let muted = false, loop = false, subsOn = true;
let narr = null, voiceMode = 'none', ttsVoice = null;
const audios = {};

function A(el, kf, at = 0, d = 0.5, o = {}) {
  if (typeof el === 'string') el = $(el, root);
  if (!el) return null;
  const a = el.animate(kf, { duration: d * 1000 * K, delay: at * 1000 * K, easing: o.e || EASE, fill: o.fill || (kf === OUT ? 'forwards' : 'both'), iterations: o.it ?? 1, direction: o.dir || 'normal' });
  anims.push(a); if (!playing) a.pause(); return a;
}
const at = (t, fn) => tasks.push({ t, fn });
const tick = (fn) => ticks.push(fn);
const nowS = () => st / 1000 / K;
const IN = [{ opacity: 0, transform: 'translateY(26px)' }, { opacity: 1, transform: 'none' }];
const POP = [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1.06)', offset: .7 }, { opacity: 1, transform: 'scale(1)' }];
const FADE = [{ opacity: 0 }, { opacity: 1 }];
const OUT = [{ opacity: 1 }, { opacity: 0 }];
function el(html, parent = root) { const t = document.createElement('template'); t.innerHTML = html.trim(); const n = t.content.firstElementChild; parent.appendChild(n); return n; }
function type(node, text, t0, cps = 12, caret = true) {
  tick((t) => { const n = Math.max(0, Math.min(text.length, Math.floor((t - t0) * cps))); const s = text.slice(0, n); const c = caret && t >= t0 && n < text.length ? '▍' : ''; if (node.__s !== s + c) { node.textContent = s + c; node.__s = s + c; } });
}
function count(node, a, b, t0, d, fmt = (v) => v) {
  tick((t) => { const p = Math.max(0, Math.min(1, (t - t0) / d)); const e = 1 - Math.pow(1 - p, 3); node.textContent = fmt(Math.round(a + (b - a) * e)); });
}
function fly(from, to, t0, d = 0.8, cls = '') {
  const p = el(`<div class="pk ${cls}" style="left:${from[0]}px;top:${from[1]}px;opacity:0"></div>`);
  A(p, [{ left: from[0] + 'px', top: from[1] + 'px', opacity: 1, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)', offset: .2 }, { left: to[0] + 'px', top: to[1] + 'px', opacity: 1, transform: 'scale(1)', offset: .95 }, { left: to[0] + 'px', top: to[1] + 'px', opacity: 0, transform: 'scale(1.8)' }], t0, d, { e: 'cubic-bezier(.5,0,.3,1)' });
  return p;
}
function press(node, t0) { A(node, [{ transform: 'scale(1)', filter: 'brightness(1)' }, { transform: 'scale(.9)', filter: 'brightness(1.6)' }, { transform: 'scale(1)', filter: 'brightness(1)' }], t0, 0.28, { fill: 'none' }); }
function ripple(cx, cy, t0, color = 'var(--lime)', n = 3, size = 320) {
  for (let i = 0; i < n; i++) {
    const r = el(`<div class="ab" style="left:${cx - size / 2}px;top:${cy - size / 2}px;width:${size}px;height:${size}px;border-radius:50%;border:6px solid ${color};opacity:0;z-index:15"></div>`);
    A(r, [{ opacity: .9, transform: 'scale(.25)' }, { opacity: 0, transform: 'scale(1.25)' }], t0 + i * 0.22, 0.9, { e: 'ease-out', fill: 'forwards' });
  }
}
function title(kicker, html, t0 = 0) {
  if (kicker) A(el(`<div class="kicker">${kicker}</div>`), FADE, t0, 0.5);
  A(el(`<div class="title">${html}</div>`), IN, t0 + 0.1, 0.6);
}
function link(pts, color = 'var(--line2)', dash = '10 10', w = 4) {
  const svg = root.querySelector('svg.ov') || el('<svg class="ov" viewBox="0 0 1600 900"></svg>');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  p.setAttribute('points', pts.map((x) => x.join(',')).join(' ')); p.setAttribute('fill', 'none'); p.setAttribute('stroke', color); p.setAttribute('stroke-width', w); p.setAttribute('stroke-dasharray', dash); p.setAttribute('stroke-linecap', 'round');
  svg.appendChild(p); return p;
}

/* ───────── Piezas reutilizables ───────── */
const CATS = [['Élite varonil', 5, 'var(--orange)'], ['Master 30', 4, 'var(--amber)'], ['Master 40', 4, 'var(--lime)'], ['Femenil', 3, 'var(--pink)'], ['Juvenil', 3, 'var(--cyan)'], ['Infantil', 1, 'var(--violet)']];
function keypadPhone(x, y, w = 330, h = 640) {
  const ph = el(`<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="scr" style="padding:46px 18px 18px">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700"><span>Serial Sierra Alta · E3</span><span class="wifi" style="color:var(--green)">● en línea</span></div>
    <div class="disp mono" style="margin-top:12px;height:86px;border-radius:14px;background:#050810;border:3px solid var(--line2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:.06em;color:#fff"></div>
    <div class="who" style="height:58px;margin:10px 0;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line)">Teclea un dorsal</div>
    <div class="pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, 'OK'].map((k) => `<i data-k="${k}" style="font-style:normal;text-align:center;background:var(--surface2);border:1px solid var(--line2);border-radius:12px;font-family:var(--display);font-size:30px;font-weight:700;padding:${h > 600 ? 8 : 4}px 0">${k}</i>`).join('')}</div>
    <div class="reg btn" style="margin-top:12px;height:${h > 600 ? 64 : 50}px;background:var(--lime);color:#13200a;font-size:28px;width:100%">Registrar paso</div>
  </div></div>`);
  return { ph, disp: $('.disp', ph), who: $('.who', ph), reg: $('.reg', ph), key: (k) => $(`[data-k="${k}"]`, ph), wifi: $('.wifi', ph) };
}
function typeBib(P, digits, t0, gap = 0.4) {
  [...digits].forEach((d, i) => { const t = t0 + i * gap; press(P.key(d), t); at(t, () => { P.disp.textContent = digits.slice(0, i + 1); }); });
}
function qrSvg(size, seed = 7) {
  let s = seed; const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const n = 25, c = size / n; let r = '';
  const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if (finder(x, y)) continue; if (rnd() > .52) r += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}"/>`; }
  const f = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" fill="none" stroke="#000" stroke-width="${c}" transform="translate(${c / 2},${c / 2})" style="transform-box:fill-box"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#fff;padding:${c}px;box-sizing:content-box;border-radius:8px"><g fill="#000">${r}${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}</g></svg>`;
}

/* ───────── Escenas ───────── */
const SCENES = {
  apertura() {
    el(`<svg class="ov" viewBox="0 0 1600 900">
      <path d="M0 720 L220 520 L360 610 L560 380 L760 560 L940 330 L1130 540 L1300 430 L1600 650 L1600 900 L0 900Z" fill="#0d1527"/>
      <path d="M0 790 L260 640 L470 730 L700 560 L930 700 L1160 590 L1400 690 L1600 610 L1600 900 L0 900Z" fill="#111c33"/>
      <path id="trail" d="M-40 810 C 180 700, 300 760, 470 700 S 760 600, 930 660 S 1250 560, 1640 600" fill="none" stroke="var(--orange)" stroke-width="5" stroke-dasharray="14 12" opacity=".7"/>
    </svg>`);
    const bike = el(`<div class="ab" style="left:0;top:0;width:46px;height:46px;margin:-30px 0 0 -23px;offset-path:path('M-40 810 C 180 700, 300 760, 470 700 S 760 600, 930 660 S 1250 560, 1640 600');offset-rotate:auto;font-size:44px;line-height:46px;text-align:center;filter:drop-shadow(0 0 14px rgba(255,90,31,.9))">🚴</div>`);
    A(bike, [{ offsetDistance: '0%' }, { offsetDistance: '100%' }], 0, 7, { e: 'linear' });
    const ring = el(`<svg class="ab" style="left:560px;top:150px" width="480" height="480" viewBox="0 0 480 480"><circle cx="240" cy="240" r="220" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="arc" cx="240" cy="240" r="220" fill="none" stroke="var(--lime)" stroke-width="10" stroke-linecap="round" stroke-dasharray="1383" transform="rotate(-90 240 240)"/></svg>`);
    A($('#arc', ring), [{ strokeDashoffset: 1383 }, { strokeDashoffset: 0 }], 0.2, 2.2, { e: 'ease-in-out' });
    A(ring, FADE, 0, 0.6);
    const logo = el(`<div class="ab" style="left:0;right:0;top:300px;text-align:center"><h1 style="font-size:150px;font-weight:800;text-transform:uppercase;line-height:.9">Chrono<span style="color:var(--lime)">Bike</span></h1></div>`);
    A(logo, POP, 0.6, 0.8);
    A(el(`<div class="ab" style="left:0;right:0;top:450px;text-align:center;font-size:32px;font-weight:600;color:var(--muted)">Cronometraje de circuitos · resultados en vivo</div>`), IN, 1.4, 0.7);
    const chips = el(`<div class="ab" style="left:0;right:0;top:560px;display:flex;gap:18px;justify-content:center"></div>`);
    ['📱 Desde un celular', '⚡ En tiempo real', '📶 Aunque falle el internet'].forEach((t, i) => A(el(`<span class="chip">${t}</span>`, chips), POP, 2.8 + i * 0.4, 0.5));
  },

  problema() {
    title('Hoy', 'Así se cronometra en <b>muchas carreras</b>');
    const note = el(`<div class="ab" style="left:80px;top:180px;width:430px;height:470px;background:#f5efe0;border-radius:10px;transform:rotate(-3deg);box-shadow:0 20px 50px rgba(0,0,0,.5);padding:34px 30px;background-image:repeating-linear-gradient(transparent 0 46px,#b9c6e0 46px 48px);font-family:Caveat,cursive;color:#1f2a44;font-size:38px;line-height:48px"></div>`);
    A(note, IN, 0.2, 0.6);
    const lines = ['#127 — 10:42:13', '#88 — 10:42:15', '#301 — 10:42:1?', '#56 — 10:4?:20', '#127 — 10:48:02'];

  else if (e.key === 's' || e.key === 'S') $('#bSubs').click();
});
// Para capturas: ?escena=N muestra esa escena congelada en el segundo ?t=
window.__pres = { go: (i) => buildScene(i), seek(t) { const target = t * 1000; setPlaying(true); while (st < target) { st += 50; const s = nowS(); const due = tasks.filter((x) => x.t <= s); tasks = tasks.filter((x) => x.t > s); due.forEach((x) => x.fn()); ticks.forEach((f) => f(s)); } anims.forEach((a) => { a.currentTime = Math.min(a.currentTime ?? 0, 1e9); }); setPlaying(false); anims.forEach((a) => { const tm = a.effect.getTiming(); a.currentTime = Math.min(target, tm.delay + tm.duration * (tm.iterations === Infinity ? 1 : tm.iterations)); }); }, plan, get state() { return { idx, st, voiceMode, version: VERSION, sub: $('#subs span').textContent }; } };
$('#vLarga').classList.toggle('on', VERSION === 'larga'); $('#vCorta').classList.toggle('on', VERSION === 'corta');
await setVersion(VERSION);
if (qs.has('escena')) { $('#cover').classList.add('hide'); window.__pres.go(+qs.get('escena') - 1); window.__pres.seek(+(qs.get('t') || 5)); }
requestAnimationFrame(frame);
</script>
